name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unzips the uploaded zip if needed)
        shell: bash
        run: |
          set -e
          S="$(find . -maxdepth 5 -name 'settings.gradle' -not -path './.git/*' | head -n 1)"
          if [ -z "$S" ]; then
            ZIP="$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)"
            if [ -z "$ZIP" ]; then echo "::error::no project and no zip in the repo"; exit 1; fi
            mkdir -p /tmp/proj
            unzip -q -o "$ZIP" -d /tmp/proj
            S="$(find /tmp/proj -maxdepth 5 -name 'settings.gradle' | head -n 1)"
          fi
          if [ -z "$S" ]; then echo "::error::settings.gradle not found"; exit 1; fi
          DIR="$(cd "$(dirname "$S")" && pwd)"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"
          ls -la "$DIR"

      - name: Pre-extract game (no first-launch unpacking) and patch app
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR/app/src/main/assets/www"
          if [ -f game.sb3 ]; then
            rm -rf /tmp/sb3 && mkdir -p /tmp/sb3 game/assets
            unzip -q -o game.sb3 -d /tmp/sb3
            mv /tmp/sb3/project.json game/project.json
            find /tmp/sb3 -type f -exec mv {} game/assets/ \;
            rm -f game.sb3
          fi
          echo "project.json: $(du -h game/project.json | cut -f1), assets: $(ls game/assets | wc -l) files, $(du -sh game/assets | cut -f1)"
          cd "$PROJECT_DIR"
          python3 - <<'PYEOF'
          import os
          root = os.environ["PROJECT_DIR"]
          def patch(path, pairs):
              p = os.path.join(root, path)
              s = open(p, encoding="utf8").read()
              for a, b in pairs:
                  if a in s:
                      s = s.replace(a, b)
                      print("patched", path, ":", a[:40])
                  else:
                      print("SKIP (not found)", path, ":", a[:40])
              open(p, "w", encoding="utf8").write(s)

          JAVA_FIELD = "private File gameDir;\n    private final java.util.concurrent.atomic.AtomicInteger fileCount = new java.util.concurrent.atomic.AtomicInteger();"
          JAVA_INTERCEPT = ("WebResourceResponse resp = loader.shouldInterceptRequest(r.getUrl());\n"
              "                String pth = r.getUrl().getPath();\n"
              "                if (pth != null && pth.startsWith(\"/assets/www/game/assets/\")) {\n"
              "                    final int n = fileCount.incrementAndGet();\n"
              "                    if (n % 5 == 0) ui.post(() -> { if (web != null) web.evaluateJavascript(\"window.__p&&window.__p(\" + n + \")\", null); });\n"
              "                }\n"
              "                return resp;")

          patch("app/src/main/java/com/axelzerox23/sprunki/MainActivity.java", [
            ("if (isReady()) { startWeb(); return; }", "startWeb(); if (true) return;"),
            (".addPathHandler(\"/data/\", new WebViewAssetLoader.InternalStoragePathHandler(this, gameDir))", ""),
            ("private File gameDir;", JAVA_FIELD),
            ("return loader.shouldInterceptRequest(r.getUrl());", JAVA_INTERCEPT),
          ])
          patch("app/src/main/assets/www/index.html", [
            ("/data/assets/", "/assets/www/game/assets/"),
            ("/data/project.json", "/assets/www/game/project.json"),
            ("const LITE=true;", "var __t0=Date.now(),__n=0,__total=0;window.__p=function(n){__n=n;};var __iv=setInterval(function(){var l=document.getElementById('loading');if(!l||l.style.display==='none'){clearInterval(__iv);return;}if(/error/i.test(l.textContent))return;var s=Math.floor((Date.now()-__t0)/1000);var p=__total>0?Math.min(100,Math.floor(__n*100/__total)):0;if(p<100){l.innerHTML='<div>\u062c\u0627\u0631\u064a \u0627\u0644\u062a\u062d\u0645\u064a\u0644\u2026 '+p+'%</div><div>Loading\u2026 '+p+'%</div>';}else{l.innerHTML='<div>\u062a\u062c\u0647\u064a\u0632 \u0627\u0644\u0623\u0635\u0648\u0627\u062a \u0648\u0627\u0644\u0631\u0633\u0648\u0645\u0627\u062a\u2026 '+s+'s</div><div>Preparing audio and graphics\u2026 '+s+'s</div>';}},400);\n  const LITE=true;"),
            ("await scaffolding.loadProject(txt);", "try{var __pj=JSON.parse(txt),__ids={};(__pj.targets||[]).forEach(function(t){(t.costumes||[]).concat(t.sounds||[]).forEach(function(a){__ids[a.assetId]=1;});});__total=Object.keys(__ids).length;}catch(e){}\n    await scaffolding.loadProject(txt);"),
          ])
          patch("app/build.gradle", [
            ("noCompress 'sb3'", "noCompress 'sb3', 'ogg', 'png'"),
          ])
          PYEOF

      - name: Lighten sounds and images
        shell: bash
        run: |
          set -e
          A="$PROJECT_DIR/app/src/main/assets/www/game/assets"
          WWW="$PROJECT_DIR/app/src/main/assets/www"
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          python3 -c "import PIL" 2>/dev/null || pip install --quiet --break-system-packages pillow || sudo apt-get install -y -qq python3-pil
          echo "== sounds: 16kHz mono =="
          BEFORE=$(cat "$A"/*.ogg | wc -c)
          mkdir -p /tmp/snd
          for f in "$A"/*.ogg; do
            b="$(basename "$f")"
            if ffmpeg -v error -y -i "$f" -vn -ac 1 -ar 16000 -c:a libvorbis -q:a 0 "/tmp/snd/$b" </dev/null; then
              mv "/tmp/snd/$b" "$f"
            else
              echo "kept original: $b"
            fi
          done
          AFTER=$(cat "$A"/*.ogg | wc -c)
          echo "sounds bytes: $BEFORE -> $AFTER"
          sed -i 's/sampleRate:22050/sampleRate:16000/' "$WWW/index.html"
          echo "== images inside SVGs: max 640px =="
          python3 - "$A" <<'PYEOF' || echo "svg optimize skipped"
          import re, glob, os, io, base64, sys
          from PIL import Image
          import xml.etree.ElementTree as ET
          MAXW = 640
          pat = re.compile(r'(href=")data:image/(png|jpe?g|webp);base64,([^"]+)(")')
          def shrink(m):
              fmt, data = m.group(2), m.group(3)
              try:
                  im = Image.open(io.BytesIO(base64.b64decode(data)))
                  if im.width <= MAXW and im.height <= MAXW:
                      return m.group(0)
                  s = MAXW / max(im.width, im.height)
                  im = im.convert('RGBA')
                  im = im.resize((max(1, round(im.width * s)), max(1, round(im.height * s))), Image.LANCZOS)
                  out = io.BytesIO()
                  im.save(out, 'WEBP', quality=80, method=4); mime = 'webp'
                  return m.group(1) + 'data:image/' + mime + ';base64,' + base64.b64encode(out.getvalue()).decode() + m.group(4)
              except Exception as e:
                  print('skip image', e); return m.group(0)
          def run(folder):
              before = after = changed = 0
              for f in glob.glob(os.path.join(folder, '*.svg')):
                  t = open(f, encoding='utf8').read()
                  b = len(t.encode('utf8'))
                  n = pat.sub(shrink, t)
                  n = re.sub(r'<!--.*?-->', '', n, flags=re.S)
                  n = re.sub(r'>\s+<', '><', n)
                  if n != t:
                      try:
                          ET.fromstring(n)
                      except Exception as e:
                          print('XML broke, keeping original:', os.path.basename(f), e); n = t
                  if n != t:
                      open(f, 'w', encoding='utf8').write(n); changed += 1
                  before += b; after += len(n.encode('utf8'))
              print('svg files changed', changed, 'MB before', round(before/1e6,2), 'after', round(after/1e6,2))
          run(sys.argv[1])
          PYEOF

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Scratch runtime from TurboWarp packager (goes inside the APK)
        shell: bash
        run: |
          DEST="$PROJECT_DIR/app/src/main/assets/www/scaffolding-full.js"
          git clone --depth 1 https://github.com/TurboWarp/packager.git /tmp/packager
          cd /tmp/packager
          export NODE_OPTIONS=--max-old-space-size=6144
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build-prod || npm run build
          SRC="$(find dist -name 'scaffolding-full.js' | head -n 1 || true)"
          if [ -z "$SRC" ]; then
            echo "::error::scaffolding-full.js was not produced"
            find dist -maxdepth 3 | head -n 40
            exit 1
          fi
          cp "$SRC" "$DEST"
          echo "Built: $SRC"
          ls -lh "$DEST"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on runner)
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > "$PROJECT_DIR/local.properties"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee /tmp/build.log

      - name: Show errors
        if: failure()
        shell: bash
        run: |
          [ -f /tmp/build.log ] || exit 0
          grep -nE 'error:|What went wrong|Execution failed|Caused by:|Could not|not found|FAILED' -A2 /tmp/build.log | head -n 80 > /tmp/errs.txt || true
          { echo '### Errors'; echo '```'; cat /tmp/errs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "=========== ERRORS ==========="
          cat /tmp/errs.txt

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          find "$PROJECT_DIR/app/build/outputs/apk" -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-out/" \;
          ls -lh "$GITHUB_WORKSPACE/apk-out"

      - uses: actions/upload-artifact@v4
        with:
          name: Sprunki-Retake-Human-apk
          path: apk-out/*.apk
          if-no-files-found: error
